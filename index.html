<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Our Slice · Bush Block</title><style>*{box-sizing:border-box}body{margin:0;background:#192d24;color:#f3efdc;font-family:system-ui,sans-serif}header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:23px}header span{font-size:12px;opacity:.8}#stage{position:relative;margin:0 10px;border:5px solid #6c8262;border-radius:18px;overflow:hidden;background:#9fb184}canvas{display:block;width:100%;touch-action:none}#msg{min-height:45px;padding:9px 17px;font-size:14px}#hud{display:flex;gap:8px;justify-content:space-between;padding:0 12px;font-size:13px;flex-wrap:wrap}#controls{display:flex;justify-content:space-between;align-items:end;padding:12px 16px 24px;gap:12px}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,54px);gap:5px}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1;grid-row:2}.dpad button:nth-child(3){grid-column:2;grid-row:2}.dpad button:nth-child(4){grid-column:3;grid-row:2}button{border:1px solid #b9c9b6;background:#426b58;color:white;border-radius:13px;font-size:23px;touch-action:none}button:active{background:#719d7c}.actions{display:flex;flex-direction:column;gap:8px}.actions button{font-size:14px;padding:12px 14px}#panel{position:fixed;z-index:3;inset:auto 12px 14px;background:#f4ebd4;color:#26372d;border-radius:14px;padding:15px;box-shadow:0 0 0 200vmax #0008;display:none;max-height:70vh;overflow:auto}#panel h3{margin:0 0 10px}#panel button{font-size:14px;padding:9px;margin:4px}#panel .close{float:right;background:#695b49}#panel p{font-size:14px}</style></head><body><header><strong>Our Slice</strong><span>Our bush block · Update 2</span></header><div id="stage"><canvas id="view" width="640" height="450"></canvas></div><div id="msg">Explore your bush block. Walk near something and tap Explore.</div><div id="hud"><span id="inventory">Backpack: empty</span><span id="found">Discoveries: 0 / 6</span></div><div id="controls"><div class="dpad"><button data-key="up">▲</button><button data-key="left">◀</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div class="actions"><button id="explore">Explore / Collect</button><button id="storage">Van storage</button><button id="camp">Set up camp</button></div></div><div id="panel"></div><script>
(()=>{'use strict';const canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),msg=document.getElementById('msg'),panel=document.getElementById('panel');const W=1900,H=1450;let player={x:830,y:750},dog={x:860,y:772},camera={x:0,y:0},keys={up:false,down:false,left:false,right:false},inventory={},stored={},camp='none',discovered=new Set(),last=0,bird=0,swear=0;const spots=[{x:660,y:590,n:'Campervan',desc:'Your silver-grey HiAce with its pop-top and awning.'},{x:1100,y:440,n:'Granite lookout',desc:'A broad granite outcrop, warm in the afternoon sun.'},{x:960,y:1040,n:'Seasonal creek',desc:'A winding seasonal creek running through the property.'},{x:425,y:960,n:'Old walking trail',desc:'A quiet track through the woodland.'},{x:1510,y:770,n:'Secret clearing',desc:'A sheltered clearing with room to build or garden.'},{x:1400,y:1160,n:'Unusual tree',desc:'There is a tiny, curious hollow in the trunk.'}];const finds=[{x:745,y:690,n:'Fallen branch',item:'Timber',qty:2},{x:1190,y:520,n:'Smooth stones',item:'Stone',qty:3},{x:520,y:875,n:'Gumnuts',item:'Gumnuts',qty:4},{x:1520,y:815,n:'Interesting bottle',item:'Vintage bottle',qty:1},{x:1130,y:1130,n:'Driftwood',item:'Driftwood',qty:1},{x:370,y:490,n:'Old tin',item:'Vintage tin',qty:1}];let taken=new Set();try{const save=JSON.parse(localStorage.getItem('our-slice-bush-v2')||'{}');if(save.inventory)inventory=save.inventory;if(save.stored)stored=save.stored;if(save.taken)taken=new Set(save.taken);if(save.discovered)discovered=new Set(save.discovered);if(save.camp)camp=save.camp;if(save.player)player=save.player}catch{}function save(){localStorage.setItem('our-slice-bush-v2',JSON.stringify({inventory,stored,taken:[...taken],discovered:[...discovered],camp,player}))}function say(s){msg.textContent=s}function hud(){document.getElementById('inventory').textContent='Backpack: '+(Object.entries(inventory).filter(([k,v])=>v>0).map(([k,v])=>`${k} ×${v}`).join(', ')||'empty');document.getElementById('found').textContent=`Discoveries: ${discovered.size} / 6`}function open(title,body){panel.style.display='block';panel.innerHTML=`<button class="close" id="close">Close</button><h3>${title}</h3>${body}`;document.getElementById('close').onclick=()=>panel.style.display='none'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function explore(){let choices=[...spots.map((o,i)=>({...o,kind:'spot',i})),...finds.map((o,i)=>({...o,kind:'find',i})).filter(o=>!taken.has(o.i))];choices.sort((a,b)=>dist(a,player)-dist(b,player));const o=choices[0];if(!o||dist(o,player)>95){say('Walk closer to a landmark or something on the ground.');return}if(o.kind==='spot'){discovered.add(o.i);say(o.desc)}else{taken.add(o.i);inventory[o.item]=(inventory[o.item]||0)+o.qty;say(`Collected ${o.item} ×${o.qty}.`)}hud();save()}function nearVan(){return dist(player,spots[0])<135}function storage(){if(!nearVan()){say('Walk over to the campervan to access storage.');return}let content='<p>Shared campervan storage (local test only). Tap an item to move it.</p><b>Backpack</b><div>';for(const [k,v] of Object.entries(inventory))if(v)content+=`<button data-move="in" data-item="${k}">${k} ×${v} → van</button>`;content+='</div><b>Van</b><div>';for(const [k,v] of Object.entries(stored))if(v)content+=`<button data-move="out" data-item="${k}">← ${k} ×${v}</button>`;content+='</div>';open('Campervan storage',content);panel.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let k=b.dataset.item,src=b.dataset.move==='in'?inventory:stored,dst=b.dataset.move==='in'?stored:inventory;if(src[k]>0){src[k]--;dst[k]=(dst[k]||0)+1;save();hud();storage()}})}function setupCamp(){if(!nearVan()){say('Walk near your van to set up camp.');return}open('Choose a campsite preset','<p>One tap places the setup beside your van.</p><button data-camp="van">Campervan + awning</button><button data-camp="swag">Swag</button><button data-camp="tent">Tent</button><button data-camp="none">Pack up</button>');panel.querySelectorAll('[data-camp]').forEach(b=>b.onclick=()=>{camp=b.dataset.camp;panel.style.display='none';say(camp==='none'?'Campsite packed away.':`Set up ${camp} campsite.`);save()})}document.getElementById('explore').onclick=explore;document.getElementById('storage').onclick=storage;document.getElementById('camp').onclick=setupCamp;for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;for(const event of ['pointerdown','pointerup','pointercancel','pointerleave'])b.addEventListener(event,e=>{e.preventDefault();keys[k]=event==='pointerdown'})}document.addEventListener('keydown',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(k){keys[k]=true;e.preventDefault()}if(e.key==='e')explore()});document.addEventListener('keyup',e=>{const k={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(k)keys[k]=false});function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}function tree(x,y,s=1){ctx.fillStyle='#675943';ctx.fillRect(x-5*s,y-2*s,10*s,24*s);ellipse(x,y,24*s,23*s,'#3e6446');ellipse(x-8*s,y-9*s,16*s,15*s,'#577e52');ellipse(x+9*s,y-4*s,12*s,14*s,'#6f915b')}function van(){let x=660,y=590;ctx.fillStyle='#555b5b';ctx.fillRect(x-68,y+26,136,14);ctx.fillStyle='#999d9c';ctx.fillRect(x-72,y-28,144,57);ctx.fillStyle='#c0c4c2';ctx.fillRect(x-70,y-31,140,37);ctx.fillStyle='#384d55';ctx.fillRect(x-45,y-24,42,24);ctx.fillRect(x+7,y-24,43,24);ctx.fillStyle='#697171';ctx.fillRect(x-70,y+14,140,7);ellipse(x-46,y+37,12,12,'#303536');ellipse(x+45,y+37,12,12,'#303536');ellipse(x-46,y+37,5,5,'#b7b8b1');ellipse(x+45,y+37,5,5,'#b7b8b1');if(camp!=='none'){if(camp==='van'){ctx.fillStyle='#d6d0bd';ctx.fillRect(x-66,y-55,132,12);ctx.fillStyle='#a8a494';ctx.fillRect(x-64,y-43,128,11);ctx.fillStyle='#c8bd9c';ctx.fillRect(x-60,y-89,120,32);line([[x-58,y-89],[x+58,y-89]],'#777c74',3);ctx.fillStyle='#d9c7a1';ctx.fillRect(x-58,y+48,110,48);line([[x-55,y+48],[x-55,y+96]],'#605f53',3);line([[x+49,y+48],[x+49,y+96]],'#605f53',3)}else if(camp==='swag'){ctx.fillStyle='#72805a';ctx.beginPath();ctx.moveTo(x+105,y+65);ctx.lineTo(x+155,y+65);ctx.lineTo(x+132,y+30);ctx.fill()}else{ctx.fillStyle='#b78357';ctx.beginPath();ctx.moveTo(x+95,y+90);ctx.lineTo(x+146,y+18);ctx.lineTo(x+197,y+90);ctx.fill();line([[x+146,y+18],[x+146,y+90]],'#74533d',2)}}}function draw(t){const w=canvas.width,h=canvas.height;camera.x=Math.max(0,Math.min(W-w,player.x-w/2));camera.y=Math.max(0,Math.min(H-h,player.y-h/2));ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(-camera.x,-camera.y);ctx.fillStyle='#a1b183';ctx.fillRect(0,0,W,H);for(let i=0;i<900;i++){const x=(i*193+41)%W,y=(i*317+37)%H;ellipse(x,y,2+(i%4),2,'#8fa879')}line([[0,680],[260,665],[420,630],[600,620],[800,610],[1020,590],[1370,560],[1900,520]],'#c2ad86',62);line([[160,1450],[320,1290],[590,1180],[830,1040],[970,880],[1060,690],[1170,460],[1260,240],[1390,0]],'#7ea8a5',45);line([[160,1450],[320,1290],[590,1180],[830,1040],[970,880],[1060,690],[1170,460],[1260,240],[1390,0]],'#b0c5ad',3);line([[380,670],[390,820],[425,960],[600,1080],[760,1200]],'#b4a184',17);for(let i=0;i<145;i++){const x=(i*271+87)%W,y=(i*197+101)%H;if(Math.hypot(x-660,y-590)<145||Math.hypot(x-1510,y-770)<100||Math.abs(y-(670-x*.07))<45)continue;tree(x,y,.7+(i%5)*.15)}ellipse(1100,440,95,60,'#979487');ellipse(1080,425,52,33,'#b5b0a1');ellipse(1510,770,130,95,'#b4b38d');van();for(let i=0;i<finds.length;i++){if(taken.has(i))continue;const o=finds[i];ellipse(o.x,o.y,8,5,'#b58c56');ellipse(o.x,o.y-4,3,3,'#eee0b5')}for(const s of spots){ctx.fillStyle='#273f31bb';ctx.fillRect(s.x-47,s.y-89,94,19);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='12px system-ui';ctx.fillText(s.n,s.x,s.y-75)}const bx=1100+Math.sin(t*.0005)*120,by=330+Math.sin(t*.002)*12;ctx.fillStyle='#313d34';ctx.beginPath();ctx.moveTo(bx-12,by);ctx.lineTo(bx,by-6);ctx.lineTo(bx+12,by);ctx.lineTo(bx,by+5);ctx.fill();ellipse(dog.x,dog.y,16,9,'#352b2b');ctx.fillStyle='#252323';ctx.beginPath();ctx.moveTo(dog.x+5,dog.y-4);ctx.lineTo(dog.x+8,dog.y-24);ctx.lineTo(dog.x+15,dog.y-4);ctx.fill();ellipse(dog.x+12,dog.y-4,7,7,'#302829');ctx.fillStyle='#e3e1d5';ctx.fillRect(dog.x-10,dog.y+4,5,10);ctx.fillRect(dog.x+8,dog.y+4,5,10);line([[dog.x-15,dog.y],[dog.x-25,dog.y-12]],'#302829',4);ellipse(player.x,player.y-17,9,10,'#e4b38d');ellipse(player.x,player.y-27,10,6,'#6e503b');ctx.fillStyle='#a45255';ctx.fillRect(player.x-10,player.y-7,20,24);ctx.fillStyle='#443b39';ctx.fillRect(player.x-8,player.y+16,6,11);ctx.fillRect(player.x+3,player.y+16,6,11);ctx.restore();if(t-swear>12000&&Math.hypot(dog.x-bx,dog.y-by)<280){swear=t;say('Aggie: WOOF! ... Fuck!')}}function frame(t){const dt=Math.min(40,t-last||16);last=t;if(!panel.style.display||panel.style.display==='none'){let dx=+keys.right-+keys.left,dy=+keys.down-+keys.up;const l=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(W-20,player.x+dx/l*dt*.19));player.y=Math.max(20,Math.min(H-20,player.y+dy/l*dt*.19));if(dist(player,dog)>32){dog.x+=(player.x-dog.x)*Math.min(1,dt*.005);dog.y+=(player.y-dog.y)*Math.min(1,dt*.005)}}draw(t);requestAnimationFrame(frame)}hud();setInterval(save,3500);window.addEventListener('pagehide',save);requestAnimationFrame(frame)})();
</script></body></html>
