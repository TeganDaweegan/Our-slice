name: Our Slice browser smoke tests
on:
  push:
    paths:
      - 'test-7-*.html'
      - 'tests/**'
      - '.github/workflows/our-slice-tests.yml'
  workflow_dispatch:
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Serve test build
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/our-slice-http.log 2>&1 &
      - name: Run browser smoke tests
        run: node tests/smoke.cjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: our-slice-failure-screenshots
          path: test-results/
          if-no-files-found: ignore
