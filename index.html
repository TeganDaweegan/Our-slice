function followCompanions(dt){const group=companion[scene];if(!group)return;const lead=scene==='cafe'?cafePos:foreshore;const k=group.k,a=group.a;const gap=scene==='cafe'?78:105;const distK=Math.hypot(lead.x-k.x,lead.y-k.y);if(distK>gap){const factor=Math.min(1,dt*.0045);k.x+=(lead.x-k.x)*factor;k.y+=(lead.y-k.y)*factor;}const target=(Math.sin(performance.now()/2600)>-.35)?lead:k;const distA=Math.hypot(target.x-a.x,target.y-a.y);if(distA>42){const factor=Math.min(1,dt*.007);a.x+=(target.x-a.x)*factor;a.y+=(target.y-a.y)*factor;}if(scene==='foreshore'){for(const c of [k,a]){if(c.x>JETTY_START&&c.x<JETTY_END-100)c.y=Math.max(436,Math.min(465,c.y));}}}
