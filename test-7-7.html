function handleTravelMessage(d){

  if(!['bush','foreshore'].includes(d.to)||!Number.isFinite(d.id))return true;
  sharedTrip={id:d.id,to:d.to,from:d.from,initiator:false};
  open('Road trip invitation',`<p>${netRole==='host'?'Kieran':'Tegan'} wants to travel together to ${d.to==='bush'?'Our Slice':'Cuntown'}.</p><button id="accept-shared-trip">Get in the HiAce</button><button id="decline-shared-trip">Not yet</button>`);
  document.getElementById('accept-shared-trip').onclick=()=>{if(!sharedTrip||sharedTrip.id!==d.id)return;sendShared({type:'travel-accept',id:d.id});panel.style.display='none';say('Getting in the van… waiting for departure.')};
  document.getElementById('decline-shared-trip').onclick=()=>{sendShared({type:'travel-decline',id:d.id});sharedTrip=null;panel.style.display='none'};
  return true;
 }
 if(!sharedTrip||sharedTrip.id!==d.id)return true;

function placeDecoration(x,y){

 if(buildMode.action){

   if(x<40||x>W-40||y<40||y>H-40||Math.hypot(x-660,y-590)<100){say('Choose a location within the property, away from the van.');return true}

   buildMode=null;saveBuild();sendBuildSync();say('Furniture moved.');return true;
  }

  let best=null,distBest=42;

   const d=Math.hypot(o.x-x,o.y-y);
   if(d<distBest){best=o;distBest=d}
  }
  if(!best&&buildMode.action==='remove'){
   best=[...buildObjects].reverse().find(o=>!o.deleted&&o.kind==='room'&&x>=o.x&&x<=o.x+o.w&&y>=o.y&&y<=o.y+o.h)||null;

   recordBuildChange(best,{...best,at:Date.now(),deleted:true});
   buildMode=null;saveBuild();sendBuildSync();say('Item removed.');return true;

  buildObjects.push(o);recordBuild(o.id,true);econ77.panels[t]--;if(t!=='floor')econ77.toolbelt.hammer--;saveEcon77();saveBuild();sendBuildSync();buildMode=null;say('Placed a 1m '+t+' panel.');return true;

// Doors and windows belong to rooms so they survive save/load and multiplayer sync.
function placeOpening(x,y,kind){
 const width=kind==='door'?32:24;
 let choice=null,dist=24;
 for(const room of buildObjects){
  if(room.deleted||room.kind!=='room')continue;
  const walls=[
   {side:'top',d:Math.abs(y-room.y),pos:x-room.x,length:room.w},
   {side:'bottom',d:Math.abs(y-(room.y+room.h)),pos:x-room.x,length:room.w},
   {side:'left',d:Math.abs(x-room.x),pos:y-room.y,length:room.h},
   {side:'right',d:Math.abs(x-(room.x+room.w)),pos:y-room.y,length:room.h}
  ];
  for(const w of walls){
   if(w.pos<0||w.pos>w.length||w.d>=dist)continue;
   const pos=Math.max(18+width/2,Math.min(w.length-18-width/2,w.pos));
   if(w.length<width+36)continue;
   choice={room,side:w.side,pos:Math.round(pos)};dist=w.d;
  }
 }
 if(!choice){say('Tap near the edge of a room with enough wall space.');return true}
 const {room,side,pos}=choice;
 const openings=Array.isArray(room.openings)?room.openings:[];
 if(openings.some(o=>o.side===side&&Math.abs(o.pos-pos)<(o.kind==='door'?32:24)/2+width/2+8)){
  say('Leave more space between doors and windows.');return true;
 }
 const next={...room,openings:[...openings,{side,pos,kind}],at:Date.now()};
 recordBuildChange(room,next);buildMode=null;saveBuild();sendBuildSync();say(kind==='door'?'Door added.':'Window added.');return true;
}
function removeOpening(x,y){
 let best=null,dist=24;
 for(const room of buildObjects){
  if(room.deleted||room.kind!=='room'||!Array.isArray(room.openings))continue;
  for(let i=0;i<room.openings.length;i++){
   const o=room.openings[i],px=room.x+(o.side==='left'?0:o.side==='right'?room.w:o.pos);
   const py=room.y+(o.side==='top'?0:o.side==='bottom'?room.h:o.pos);
   const d=Math.hypot(px-x,py-y);
   if(d<dist){dist=d;best={room,index:i}}
  }
 }
 if(!best){say('Tap closer to the door or window you want to remove.');return true}
 const {room,index}=best;
 recordBuildChange(room,{...room,openings:room.openings.filter((_,i)=>i!==index),at:Date.now()});
 buildMode=null;saveBuild();sendBuildSync();say('Opening removed.');return true;
}

function roomWallBlocks(x1,y1,x2,y2){
 // Check crossings against solid wall segments. Door openings are passable; windows are not.
 for(const room of buildObjects){
  if(room.deleted||room.kind!=='room')continue;
  const openings=Array.isArray(room.openings)?room.openings:[];
  const crossed=(side,pos,coordinate)=>{
   const gap=openings.some(o=>o.kind==='door'&&o.side===side&&Math.abs(o.pos-pos)<=13);
   return !gap;
  };
  for(const [side,axis,edge,start,end] of [
   ['top','y',room.y,room.x,room.x+room.w],
   ['bottom','y',room.y+room.h,room.x,room.x+room.w],
   ['left','x',room.x,room.y,room.y+room.h],
   ['right','x',room.x+room.w,room.y,room.y+room.h]
  ]){
   const a=axis==='x'?x1:y1,b=axis==='x'?x2:y2;
   if(a===b||!(edge>=Math.min(a,b)&&edge<=Math.max(a,b)))continue;
   const t=(edge-a)/(b-a);
   if(t<0||t>1)continue;
   const position=axis==='x'?y1+(y2-y1)*t:x1+(x2-x1)*t;
   if(position<start||position>end)continue;
   if(crossed(side,position-start,edge))return true;
  }
 }
 return false;
}
function moveThroughRooms(x,y){
 // Axis-by-axis movement allows sliding along walls instead of sticking at corners.
 const nx=Math.max(20,Math.min(W-20,x)),ny=Math.max(20,Math.min(H-20,y));
 if(!roomWallBlocks(player.x,player.y,nx,player.y))player.x=nx;
 if(!roomWallBlocks(player.x,player.y,player.x,ny))player.y=ny;
}
function drawRoom(room){
 ctx.save();
 const material=ROOM_MATERIALS[room.material]||ROOM_MATERIALS.timber;
 const floor=ROOM_FLOORS[room.floor]||ROOM_FLOORS.boards;
 ctx.fillStyle=room.floor?floor.color:material.floor;ctx.fillRect(room.x,room.y,room.w,room.h);
 ctx.strokeStyle=material.trim;ctx.lineWidth=2;ctx.strokeRect(room.x+12,room.y+12,room.w-24,room.h-24);
 const openings=Array.isArray(room.openings)?room.openings:[];
 for(const [side,length] of [['top',room.w],['bottom',room.w],['left',room.h],['right',room.h]]){
  const slots=openings.filter(o=>o.side===side&&['door','window'].includes(o.kind)&&Number.isFinite(o.pos)).sort((a,b)=>a.pos-b.pos);
  let cursor=0;
  const wall=(from,to)=>{
   if(to<=from)return;
   ctx.fillStyle=material.wall;
   if(side==='top')ctx.fillRect(room.x+from,room.y-5,to-from,10);
   if(side==='bottom')ctx.fillRect(room.x+from,room.y+room.h-5,to-from,10);
   if(side==='left')ctx.fillRect(room.x-5,room.y+from,10,to-from);
   if(side==='right')ctx.fillRect(room.x+room.w-5,room.y+from,10,to-from);
  };
  for(const slot of slots){
   const half=slot.kind==='door'?16:12,start=Math.max(cursor,slot.pos-half),end=Math.min(length,slot.pos+half);
   wall(cursor,start);
   ctx.fillStyle=slot.kind==='door'?'#b78a55':'#8cc5d2';
   if(side==='top'||side==='bottom'){
    const yy=room.y+(side==='bottom'?room.h:0);
    ctx.fillRect(room.x+start,yy-4,end-start,8);
    if(slot.kind==='door'){ctx.strokeStyle='#f5d5a0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(room.x+start,yy,24,0,Math.PI/2);ctx.stroke()}
   }else{
    const xx=room.x+(side==='right'?room.w:0);
    ctx.fillRect(xx-4,room.y+start,8,end-start);
   }
   cursor=end;
  }
  wall(cursor,length);
 }
 ctx.restore();
}

function movementVector(dt){
 const dx=Number(keys.right)-Number(keys.left),dy=Number(keys.down)-Number(keys.up);
 const l=Math.hypot(dx,dy);
 let tx=0,ty=0;
 if(l){touchMove.goal=null;tx=dx/l;ty=dy/l}

  const p=controlledPosition(),vx=touchMove.goal.x-p.x,vy=touchMove.goal.y-p.y,d=Math.hypot(vx,vy);
  if(d>5){tx=vx/d;ty=vy/d}else{touchMove.goal=null}

 // Low-pass filter direction and speed to avoid sudden changes.
 const blend=1-Math.exp(-dt/110);
 touchMove.velocity.x+=(tx-touchMove.velocity.x)*blend;
 touchMove.velocity.y+=(ty-touchMove.velocity.y)*blend;
 const v=Math.hypot(touchMove.velocity.x,touchMove.velocity.y);
 if(v>1){touchMove.velocity.x/=v;touchMove.velocity.y/=v}
 return touchMove.velocity;
}
